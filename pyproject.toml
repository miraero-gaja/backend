[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miraeasset-financial-agent-backend"
version = "0.1.0"
description = "Production-oriented backend skeleton for the Mirae Asset financial product agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "pydantic>=2.10.4,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "starlette>=1.6.0,<1.7.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
data = [
    "openpyxl>=3.1.5,<4.0.0",
]
test = [
    "httpx2>=2.0.0,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pytest>=8.3.4,<10.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
